services:
  - type: web
    name: fixclean-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: yarn install && yarn build && yarn seed
    startCommand: yarn start:prod
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
